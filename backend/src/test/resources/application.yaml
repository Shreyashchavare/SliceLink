spring:
  datasource:
    url: jdbc:h2:mem:slicelink;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false
