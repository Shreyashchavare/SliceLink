spring:
  datasource:
    url: jdbc:h2:mem:slicelink-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 500

management:
  health:
    redis:
      enabled: false
    kafka:
      enabled: false

slicelink:
  security:
    jwt:
      secret: test-secret-that-is-at-least-thirty-two-characters-long
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    cors:
      allowed-origin: http://localhost:5173
  cache:
    url-ttl: PT24H
    key-prefix: "url:redirect:"
  kafka:
    click-topic: "slicelink.url.clicks"
    consumer-group: "slicelink-analytics"
